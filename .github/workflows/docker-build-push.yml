name: Docker

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git Ref
        required: false
        default: main
        type: string

jobs:
  build:
    name: build
    # Was [self-hosted] upstream. A fork has no such runner, so the workflow
    # never started at all — it sat queued forever with no error.
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{inputs.ref}}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: package.json
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Build
        run: pnpm run dash:build

      # Upstream also pushes to Docker Hub. This fork does not: it has no
      # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets, and the login step fails on
      # empty credentials before the build starts. ghcr.io is the registry this
      # fork deploys from, and GITHUB_TOKEN is enough for it.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculate Image Tags
        env:
          # `inputs.ref` exists only for workflow_dispatch. On a push it is empty,
          # and the case statement below would fall through to its error branch —
          # which is exactly what happened on the first push-triggered run. Falling
          # back to the pushed branch name makes both triggers work.
          INPUT_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          declare TAGS=""
          case "${INPUT_REF}" in
          [0-9]*.[0-9]*.[0-9]*)
            TAGS="${INPUT_REF}"
            if [[ "$(git rev-parse origin/main)" = "$(git rev-parse "${INPUT_REF}")" ]]; then
              TAGS="${TAGS} latest"
            elif [[ "$(git describe --tags --abbrev=0 origin/main)" = "${INPUT_REF}" ]]; then
              TAGS="${TAGS} latest"
            fi
            ;;
          main)
            TAGS="latest"
            for tag in $(git tag --points-at | grep "^[0-9]*\.[0-9]*\.[0-9]*$" | xargs); do
              TAGS="${TAGS} ${tag}"
            done
            ;;
          dev)
            TAGS="edge"
            for tag in $(git tag --points-at | grep "^[0-9]*\.[0-9]*\.[0-9]*$" | xargs); do
              TAGS="${TAGS} ${tag}"
            done
            ;;
          *)
            echo "Invalid Input Ref: ${INPUT_REF}"
            exit 1
          esac

          if [[ -z "${TAGS}" ]]; then
            echo "Empty Tags!"
            exit 1
          fi

          {
            echo 'DOCKER_IMAGE_TAGS<<EOF'
            for tag in ${TAGS}; do
            echo "ghcr.io/mohamediburan/stremthru:${tag}"
            done
            echo EOF
          } >> "${GITHUB_ENV}"

          cat "${GITHUB_ENV}"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Upstream builds arm64 too. The deploy target here is x86_64, and the
          # arm64 leg is a CGO+zig cross-build under QEMU — slow, and the most
          # likely part of this workflow to fail. Add it back if you need it.
          platforms: linux/amd64
          push: true
          context: .
          file: ./Dockerfile
          tags: ${{env.DOCKER_IMAGE_TAGS}}
